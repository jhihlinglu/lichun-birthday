<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>LiChun 的房間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
:root{
  --ink:#07060c; --paper:#f7e8c8; --dim:#b9a78f; --amber:#f7c667; --rose:#e58c8a;
  --zh:'Huninn','PingFang TC','Microsoft JhengHei',sans-serif;
  --px:'Pixelify Sans','Huninn',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--zh);overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
#film{position:fixed;inset:0;width:100%;height:100%;display:block}
#track{position:relative;width:1px;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  text-align:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));
  transition:opacity 1.1s ease,visibility 1.1s;background:radial-gradient(ellipse at center,rgba(7,6,12,.62),rgba(7,6,12,.1) 70%)}
#intro.gone{opacity:0;visibility:hidden}
#intro small{font-family:var(--px);letter-spacing:.32em;font-size:13px;color:var(--amber);padding-left:.32em}
#intro h1{margin:0;font-weight:400;font-size:clamp(25px,4.6vw,40px);line-height:1.5;letter-spacing:.05em;text-wrap:balance;text-shadow:0 2px 18px #000}
#switch{display:flex;flex-direction:column;align-items:center;gap:12px}
#switch canvas{width:60px;height:96px;image-rendering:pixelated;display:block;filter:drop-shadow(0 0 16px rgba(247,198,103,.55));transition:transform .2s}
#switch:hover canvas{transform:scale(1.07)}
#switch span{font-size:15px;letter-spacing:.14em;color:var(--dim);text-shadow:0 1px 8px #000}

#hud{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .9s}
#hud.on{opacity:1;visibility:visible}
#track-label{position:absolute;left:max(22px,env(safe-area-inset-left,0px));top:max(20px,env(safe-area-inset-top,0px));
  font-family:var(--px);font-size:14px;letter-spacing:.14em;color:var(--paper);text-shadow:0 1px 6px #000;transition:opacity .5s}
#track-label b{font-weight:600;color:var(--amber);margin-right:.7em}
#track-label i{font-family:var(--zh);font-style:normal;letter-spacing:.2em}
#ctrl{position:absolute;right:max(18px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px));display:flex;gap:6px;pointer-events:auto}
#ctrl button{width:38px;height:38px;background:rgba(10,8,14,.48);border:1px solid rgba(247,232,200,.22);display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s}
#ctrl canvas{width:22px;height:22px;image-rendering:pixelated;display:block}
#ctrl button:hover{background:rgba(10,8,14,.78);border-color:var(--amber)}
#ctrl button.on{border-color:var(--amber)}
#tease{position:absolute;left:0;right:0;top:13%;text-align:center;font-size:15px;letter-spacing:.18em;color:var(--paper);text-shadow:0 1px 8px #000;opacity:0;transition:opacity .6s}
#tease.on{opacity:.95}

#sub{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(max(36px,env(safe-area-inset-bottom,0px)) + 1.5vh);width:min(90vw,44em);
  text-align:center;font-size:clamp(17px,2.1vw,23px);line-height:1.65;letter-spacing:.09em;text-shadow:0 2px 10px #000;pointer-events:none;text-wrap:balance}
#sub .rest{opacity:0}
#sub.up{bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 54px)}
#end{position:fixed;z-index:11;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:opacity 1s}
#end.on{opacity:1;pointer-events:auto}
#replay{font-size:14px;letter-spacing:.14em;padding:9px 20px;border:1px solid rgba(247,232,200,.4);background:rgba(10,8,14,.5);transition:all .2s;white-space:nowrap}
#replay:hover{border-color:var(--amber);color:var(--amber)}
#ask{position:fixed;z-index:12;left:0;right:0;margin:0 auto;bottom:calc(max(22px,env(safe-area-inset-bottom,0px)) + 2vh);width:min(92vw,40em);text-align:center;opacity:0;pointer-events:none;transition:opacity 1s}
#ask.on{opacity:1;pointer-events:auto}
#ask p{margin:0 0 18px;font-size:clamp(19px,2.6vw,27px);line-height:1.5;letter-spacing:.1em;text-shadow:0 2px 12px #000;text-wrap:balance}
#askBtns{display:flex;gap:18px;justify-content:center}
#askBtns button{font-family:var(--px);font-size:20px;letter-spacing:.14em;padding:10px 30px;border:2px solid var(--amber);transition:transform .25s,left .25s,top .25s,background .2s;white-space:nowrap}
#yes{background:var(--amber);color:#2a1426}
#yes:hover{background:#ffd98a}
#no{color:var(--paper);background:rgba(10,8,14,.6);border-color:rgba(247,232,200,.5)!important;font-family:var(--zh)!important}
#no.turned{background:var(--amber);color:#2a1426;border-color:var(--amber)!important}
#ctrl button.cue{border-color:var(--amber);animation:cue 1.3s ease-in-out infinite}
@keyframes cue{50%{box-shadow:0 0 0 4px rgba(247,198,103,.3),0 0 18px rgba(247,198,103,.6)}}
@media (prefers-reduced-motion:reduce){#ctrl button.cue{animation:none}}
</style>
</head>
<body class="locked">
<canvas id="film" aria-label="LiChun 的生日動畫：一間像素小房間的故事"></canvas>
<div id="track"></div>

<div id="hud">
  <div id="track-label"><b></b><i></i></div>
  <div id="ctrl">
    <button id="auto"><canvas width="11" height="11"></canvas></button>

  </div>

</div>

<div id="end"><button id="replay">AGAIN</button></div>
<div id="ask"><p id="askText"></p><div id="askBtns"><button id="yes">YES</button><button id="no">NO</button></div></div>

<div id="intro">

</div>

<script>
/* ===== 文案都在這裡，改這一段就好 ===== */
const NAME='LiChun';
const BIRTHDAY={month:'NOV',day:18,label:'11.18'};
const COPY={
  intro:`準備一個神祕小屋，<br>替 俐君 留著燈火`,
  tracks:[
    {name:'唱片',text:'來點音樂，氣氛一下吧~ MUSIC START~'},
    {name:'相框',text:'我們在維多利亞港的星光大道，一起看的香港夜景~'},
    {name:'便利貼',text:'妳屁股有幾根毛我都了然於心~'},
    {name:'香菇',text:'香菇!!是絕對不行的!! 錯過了好多菇菇料理~'},
    {name:'貓貓',text:'貓貓或許是妳我未來的玩伴?!'},
    {name:'蛋糕',text:'大力許下妳今年的希望吧~'}
  ],
  notes:['高單價坪數的指甲','積山的衣服','小小潔癖','喜歡小寵物'],
  sideB:{
    tracks:['翻面!!','求婚'],
    flip:'還有一面，想另外放給妳聽~',
    propose:'不知道妳剛剛的生日願望有沒有剛好許到，我們的未來~',
    ask:'俐君，妳願意和我結婚、走後半輩子嗎?',
    yes:'我就知道妳會YES~ 未來的未來，我們共同體驗每一個時刻~',
    noTries:['再想想？','真的嗎？','按不到喔']
  },
  teaseMouse:'移動游標，逗逗牠',
  teaseTouch:'手指滑動，逗逗牠',
  ending:'生日快樂，俐君~ 願新的一年，也能過得像煙火一樣燦爛奪目~'
};
</script>

<script>
(()=>{'use strict';
/* ---------- basics ---------- */
const $=s=>document.querySelector(s);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,f)=>a+(b-a)*f;
const ss=(a,b,v)=>{const f=clamp((v-a)/(b-a));return f*f*f*(f*(6*f-15)+10)};
const rng=s=>()=>(s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const BAYER=[[0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],[12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],[3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],[15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21]];
const bay=(x,y)=>(BAYER[y&7][x&7]+.5)/64;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];

const PAL={ink:'#17121f',plum:'#2a1c33',wine:'#5a2438',rust:'#a4472f',amber:'#e99a3c',gold:'#f7c667',cream:'#f4e3c1',bone:'#cdb795',
  teal0:'#14343b',teal1:'#1d464c',teal2:'#285a5e',teal3:'#3a7774',sage:'#7e9f6e',moss:'#4a6b45',leaf:'#2f5238',
  wood0:'#301b16',wood1:'#4d2c1e',wood2:'#6e4228',wood3:'#946238',rose:'#e58c8a',pink:'#f3b7b0',sky:'#8fc3d6',navy:'#1c2a4a',white:'#fff4dd',
  mustard:'#c9922e',mustard2:'#a06f22',mustard3:'#e6b552',steel:'#b9bcc7',steel2:'#6d7080'};

/* ---------- pixel kit ---------- */
let g=null;
const mk=(w,h,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;
  const b={c,x,w,h};if(fn){const p=g;g=x;fn(b);g=p}return b};
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
const P=(x,y,c)=>R(x,y,1,1,c);
const Dth=(x,y,w,h,c,f)=>{g.fillStyle=c;for(let j=0;j<h;j++)for(let i=0;i<w;i++){const v=typeof f==='number'?f:f(i/w,j/h);if(v>bay(x+i,y+j))g.fillRect(x+i,y+j,1,1)}};
const Ell=(cx,cy,rx,ry,c)=>{g.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);for(let y=-ry;y<=ry;y++){const w=Math.floor(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry||1)))+.35);g.fillRect(cx-w,cy+y,w*2+1,1)}};
const Disc=(cx,cy,r,c)=>Ell(cx,cy,r,r,c);
const Line=(x0,y0,x1,y1,c,th=1)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);g.fillStyle=c;for(let i=0;i<=n;i++){const x=Math.round(x0+(x1-x0)*i/n-(th-1)/2),y=Math.round(y0+(y1-y0)*i/n-(th-1)/2);g.fillRect(x,y,th,th)}};
const Box=(x,y,w,h,b,hi,lo,ln)=>{if(ln){R(x-1,y-1,w+2,h+2,ln)}R(x,y,w,h,b);if(hi){R(x,y,w,1,hi);R(x,y,1,h,hi)}if(lo){R(x,y+h-1,w,1,lo);R(x+w-1,y,1,h,lo)}};
const S=(rows,x,y,map)=>{rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const k=r[i];if(k!=='.')P(x+i,y+j,typeof map==='string'?map:map[k])}})};
const SPR={
  heart:['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'],
  star:['...X...','...X...','XXXXXXX','.XXXXX.','..XXX..','.XX.XX.','.X...X.'],
  note:['...XX.','...X.X','...X..','...X..','.XXX..','XXXX..','.XX...']
};
const FONT={A:'0E11111F111111',B:'1E11111E11111E',C:'0E11101010110E',D:'1E11111111111E',E:'1F10101E10101F',F:'1F10101E101010',G:'0E11101711110F',H:'1111111F111111',I:'0E04040404040E',J:'07020202 02120C'.replace(' ',''),K:'11121418141211',L:'1010101010101F',M:'111B1515111111',N:'11191513111111',O:'0E11111111110E',P:'1E11111E101010',Q:'0E11111115120D',R:'1E11111E141211',S:'0F10100E01011E',T:'1F040404040404',U:'1111111111110E',V:'11111111110A04',W:'1111111515 1B11'.replace(' ',''),X:'11110A040A1111',Y:'11110A04040404',Z:'1F01020408101F',0:'0E11131519110E',1:'040C040404040E',2:'0E110102040 81F'.replace(' ',''),3:'1F020402 01110E'.replace(' ',''),4:'02060A121F0202',5:'1F101E0101110E',6:'060810 1E11110E'.replace(' ',''),7:'1F010204080808',8:'0E11110E11110E',9:'0E11110F01020C'};
const Txt=(str,x,y,c,s=1)=>{for(const ch of str){const f=FONT[ch];if(f){for(let j=0;j<7;j++){const v=parseInt(f.slice(j*2,j*2+2),16);for(let i=0;i<5;i++)if(v&(16>>i))R(x+i*s,y+j*s,s,s,c)}}x+=6*s}};
const txtW=(str,s=1)=>str.length*6*s-s;
const NAMEU=NAME.toUpperCase();

/* soft light bloom sprites (smooth on purpose, HD-2D style) */
const glowCache={};
const glow=c=>{if(glowCache[c])return glowCache[c];const b=mk(128,128);const [r,gg,bb]=hex(c);const d=b.x.createRadialGradient(64,64,0,64,64,64);
  d.addColorStop(0,`rgba(${r},${gg},${bb},.9)`);d.addColorStop(.3,`rgba(${r},${gg},${bb},.33)`);d.addColorStop(1,`rgba(${r},${gg},${bb},0)`);b.x.fillStyle=d;b.x.fillRect(0,0,128,128);return glowCache[c]=b.c};

/* dithered light masks: a pixel is either lit or not, density falls off with distance */
const mkLight=(rx,ry,pow=1.25,gain=1.9)=>{const b=mk(rx*2,ry*2);const im=b.x.createImageData(rx*2,ry*2),d=im.data;
  for(let y=0;y<ry*2;y++)for(let x=0;x<rx*2;x++){const dx=(x-rx)/rx,dy=(y-ry)/ry,r=Math.sqrt(dx*dx+dy*dy);if(r>=1)continue;
    if(Math.pow(1-r,pow)*gain>bay(x,y)){const o=(y*rx*2+x)*4;d[o]=d[o+1]=d[o+2]=d[o+3]=255}}
  b.x.putImageData(im,0,0);return b};
const remap=(src,fn)=>{const b=mk(src.w,src.h);b.x.drawImage(src.c,0,0);const im=b.x.getImageData(0,0,src.w,src.h),d=im.data;
  for(let i=0;i<d.length;i+=4){if(d[i+3]===0)continue;const o=fn(d[i],d[i+1],d[i+2]);d[i]=o[0];d[i+1]=o[1];d[i+2]=o[2]}b.x.putImageData(im,0,0);return b};
const toNight=(r,gr,b)=>[r*.2+5,gr*.23+7,b*.4+17];

/* ---------- cat, shared by room and finale ---------- */
const drawCat=(x,y,pose,f,lit,hat,dir=1)=>{
  const o=lit?'#e9a45a':'#3d3a5c',d=lit?'#b96f34':'#2b2946',w=lit?'#fff0d8':'#66648a',k=lit?PAL.ink:'#0e0d18',p=lit?PAL.pink:'#55506e';
  x=Math.round(x);y=Math.round(y);
  if(pose==='loaf'){Ell(x,y-5,11,6,o);R(x-6,y-10,2,4,d);R(x-1,y-11,2,4,d);R(x+3,y-10,2,3,d);Ell(x+1,y-1,7,1,w);R(x-15,y-3,8,3,o);R(x-15,y-3,3,3,d);
    Disc(x+9,y-8,5,o);R(x+5,y-14,2,3,o);R(x+11,y-14,2,3,o);R(x+6,y-13,1,1,p);R(x+12,y-13,1,1,p);R(x+7,y-9,2,1,k);R(x+11,y-9,2,1,k);R(x+9,y-7,1,1,p)}
  else if(pose==='sit'){Line(x+5,y-1,x+12,y-6+Math.round(Math.sin(f)*1.4),d,2);Ell(x,y-6,6,7,o);Ell(x,y-5,3,5,w);Disc(x,y-15,5,o);R(x-5,y-21,2,3,o);R(x+4,y-21,2,3,o);R(x-4,y-20,1,1,p);R(x+5,y-20,1,1,p);R(x-2,y-20,1,3,d);R(x+1,y-20,1,3,d);
    R(x-3,y-16,2,2,k);R(x+2,y-16,2,2,k);R(x,y-13,1,1,p);R(x-3,y,3,1,w);R(x+1,y,3,1,w)}
  else{const s=Math.floor(f)%2,h=dir;Ell(x,y-8,9,4,o);R(x-3,y-11,2,3,d);R(x+1,y-11,2,3,d);[-7,-3,3,7].forEach((lx,i)=>R(x+lx,y-5,2,(i+s)%2?5:3,i%3?o:d));
    Disc(x+h*10,y-12,4,o);R(x+h*7,y-17,2,3,o);R(x+h*12,y-17,2,3,o);R(x+h*12,y-13,2,1,k);Line(x-h*9,y-9,x-h*14,y-15,d,2)}
  if(hat){const hx=pose==='sit'?x:x+9,hy=pose==='sit'?y-20:y-13;for(let i=0;i<7;i++)R(hx-3+i/2,hy-i,7-i,1,i%3?PAL.rose:PAL.gold);P(hx,hy-8,PAL.cream);P(hx,hy-7,PAL.cream)}
};

/* ---------- the room ---------- */
const RW=800,RH=400;
const paintRoom=withCake=>mk(RW,RH,()=>{
  const r=rng(7);
  /* wall */
  R(0,0,RW,306,PAL.teal2);
  for(let x=0;x<RW;x+=20){R(x,24,7,208,PAL.teal1);R(x+7,24,1,208,'#245357')}
  for(let y=34,row=0;y<230;y+=20,row++)for(let x=(row%2)*10+3;x<RW;x+=20){P(x,y,PAL.teal3);P(x-1,y+1,PAL.teal3);P(x+1,y+1,PAL.teal3);P(x,y+2,PAL.teal3)}
  Dth(0,24,RW,70,PAL.teal0,(u,v)=>(1-v)*.6);
  Dth(0,24,70,208,PAL.teal0,(u)=>(1-u)*.55);Dth(730,24,70,208,PAL.teal0,(u)=>u*.55);
  /* cornice and rail */
  R(0,0,RW,16,PAL.bone);R(0,0,RW,4,PAL.cream);R(0,16,RW,3,PAL.wood1);R(0,19,RW,5,PAL.bone);R(0,23,RW,1,PAL.wood0);
  for(let x=0;x<RW;x+=10)R(x,8,4,5,'#b09a78');
  /* wainscot */
  R(0,230,RW,4,PAL.cream);R(0,234,RW,1,PAL.wood1);R(0,235,RW,62,PAL.teal1);
  for(let x=8;x<RW;x+=62){Box(x,242,50,46,'#183d43','#102d33',PAL.teal3);R(x+4,246,42,38,PAL.teal1)}
  R(0,296,RW,10,PAL.cream);R(0,296,RW,1,PAL.white);R(0,305,RW,2,PAL.wood0);
  /* herringbone-ish floor with perspective rows */
  R(0,307,RW,93,PAL.wood1);
  let y=307,h=5,row=0;while(y<RW){const len=26+h*3;let x=-((row*17)%len);while(x<RW){const c=[PAL.wood1,PAL.wood2,'#5c3722','#62402a'][Math.floor(r()*4)];
      R(x,y,len-1,h-1,c);R(x,y,len-1,1,'#7d5030');x+=len}
    R(0,y+h-1,RW,1,PAL.wood0);y+=h;h=Math.min(h+1,14);row++;if(y>RH)break}
  Dth(0,307,RW,60,PAL.wood0,(u,v)=>(1-v)*.42);
  /* window light pooled on floor */
  Dth(420,312,200,86,'#a0703f',(u,v)=>Math.sin(u*3.14)*(1-v)*.5);
  /* rug */
  const rug=(a,b,c,d,col)=>{for(let j=c;j<d;j++){const w=lerp(a,b,(j-322)/66);R(400-w,j,w*2,1,col)}};
  rug(165,205,322,388,PAL.wine);rug(158,198,325,385,PAL.rust);rug(150,190,328,382,PAL.wine);rug(120,160,335,376,'#6d2c42');
  for(let i=0;i<14;i++){const u=i/13,xx=lerp(275,525,u);R(xx,349,8,1,PAL.gold);R(xx+2,347,4,5,PAL.amber);R(xx+3,348,2,3,PAL.wine)}

  const lab=$('#track-label');
  const ls=sceneNow&&sceneNow.s,lb=ls?(ls.label||(ls.track<=N?[ls.track<N?`TRACK ${String(ls.track+1).padStart(2,'0')}`:'ENCORE',COPY.tracks[ls.track].name]:null)):null;
  if(lb){const k=lb.join('|');if(lab.dataset.k!==k){lab.dataset.k=k;lab.children[0].textContent=lb[0];lab.children[1].textContent=lb[1]}lab.style.opacity=1}else lab.style.opacity=0;
  $('#tease').classList.toggle('on',!!sceneNow&&sceneNow.s.id==='cat'&&sceneNow.q>.16&&sceneNow.q<.56);
  const rs=scenes[RING],ringQ=u>=rs.a?clamp((u-rs.a)/rs.len):-1;

  const ended=yesAt>0&&t-yesAt>3.5&&ringQ>=0;$('#end').classList.toggle('on',ended);subEl.classList.toggle('up',ended);

  /* music */

  /* PART 1 from the needle drop until the lights go out, PART 2 from the first candle through the fireworks,
     PART 3 once the needle drops on side B, PART 4 after YES; silence in the gaps between */
  A.setSong(u<NEEDLE?'':u<uOff?'p1':u<IGNITE?'':u<FLIP_UP?'p2':u<NEEDLE_B?'':yesAt>0?'p4':'p3');
  const sid=active.length?active[active.length-1].s.id:'';A.bed(sid==='photo'?1:0);
}
